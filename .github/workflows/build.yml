name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Install build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y             \
                autoconf                    \
                build-essential             \
                libbz2-dev                  \
                libltdl-dev                 \
                liblzma-dev                 \
                libflac-dev                 \
                libpcre2-dev                \
                libpython3-dev              \
                libzzip-dev                 \
                python3-pip                 \
                wget
        pip3 install --break-system-packages "setuptools[core]>=77" "numpy>=2.0" \
            hypothesis pytest
        echo CC=gcc-14 >> $GITHUB_ENV
        echo CXX=g++-14 >> $GITHUB_ENV
        echo PREFIX=/usr >> $GITHUB_ENV

    - name: Install build dependencies
      if: runner.os == 'macOS'
      run: |
        brew install automake libtool gcc pcre pcre2 xz flac python@3.12 \
            bzip2 libzzip
        pip3.12 install setuptools "numpy>=2.0" hypothesis pytest \
            --break-system-packages
        echo CC=gcc-14 >> $GITHUB_ENV
        echo CXX=g++-14 >> $GITHUB_ENV
        echo FC=gfortran-14 >> $GITHUB_ENV
        echo F77=gfortran-14 >> $GITHUB_ENV
        echo PREFIX=/opt/homebrew >> $GITHUB_ENV

    - name: Configure
      run: |
        autoreconf -i
        ./configure --disable-php --with-python=`which python3.12` \
            --with-ltdl=$PREFIX \
            --with-liblzma=$PREFIX \
            --with-libFLAC=$PREFIX \
            --with-pcre=$PREFIX

    - name: Build
      run: make

    - name: Run regression tests
      run: make check
